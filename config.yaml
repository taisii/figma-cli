# 研究支援ツール設定（API非依存）

document_ingest:
  # ソース配置（任意）
  raw_dir: "data/raw/papers"
  # 論文本文とメタデータの配置先
  processed_dir: "context/papers"
  # 要約の集約先（別名を配置）
  summaries_dir: "context/summaries/papers"
  # 要約の簡易インデックス
  summary_index_path: "context/summaries/papers/index.json"
  # 論文一次索引
  index_path: "context/papers/index.yaml"
