# Codex CLI 共通設定

# ドキュメント取り込みに関する設定 (PDF / TeX 共通)
document_ingest:
  # ソースを置く生ファイル置き場（論文）
  raw_dir: "data/raw/papers"
  # 変換済み Markdown やメタデータの配置先（論文）
  processed_dir: "context/papers"
  # 要約の集約先（論文サマリー専用）
  summaries_dir: "context/summaries/papers"
  # 要約の簡易インデックス（論文サマリー専用）
  summary_index_path: "context/summaries/papers/index.json"
  # Codex にサマリー生成を依頼するコマンド（paper_path/slug をフォーマットで展開可能）
  summary_command:
    - "codex"
    - "prompt"
    - "summary"
  # 索引ファイル（論文専用の一次索引）
  index_path: "context/papers/index.yaml"

session_manager:
  # 既定の知識ベース（論文のみ）
  knowledge_dir: "context/summaries/papers"
  # CLI 起動時にサマリーを自動ロードするか
  auto_preload: true
  # 自動ロードする最大件数 (None 相当で制限なし)
  preload_limit: 200
  # 会話要約に利用する Codex コマンド
  summary_command:
    - "codex"
    - "prompt"
    - "session-summary"
  # 必要に応じて環境変数を追加する場合は summary_env に記載してください。
  # summary_env:
  #   CODEX_SESSION_TITLE: "研究ログ"
